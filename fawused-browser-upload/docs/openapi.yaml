        page_size:
          type: integer
        total:
          type: integer

    ComplaintCreate:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [duplicate, sold, wrong_data, fraud, stolen_content, prohibited, other]
        comment:
          type: [string, 'null']
          maxLength: 2000

    Complaint:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [new, in_review, resolved, rejected]
        created_at:
          type: string
          format: date-time

    ModelReference:
      type: object
      properties:
        id:
          type: string
          format: uuid
