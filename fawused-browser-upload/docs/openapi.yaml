              format: uuid
            lifecycle_status:
              $ref: '#/components/schemas/ListingLifecycleStatus'
            trust_status:
              $ref: '#/components/schemas/TrustStatus'
            vin_masked:
              type: string
            created_at:
              type: string
              format: date-time
            published_at:
              type: [string, 'null']
              format: date-time
            updated_at:
              type: string
              format: date-time
            photos:
              type: array
              items:
                $ref: '#/components/schemas/ListingPhoto'

    ListingPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer

    PublicListingSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        model:
          type: string
        production_year:
          type: integer
        mileage_km:
          type: integer
        price_rub:
          type: integer
        vat_status:
          $ref: '#/components/schemas/VatStatus'
