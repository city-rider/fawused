          type: integer
        reveal_phone:
          type: integer
        telegram_click:
          type: integer
        favorites:
          type: integer

    ApiCredentialCreate:
      type: object
      required: [name, scopes]
      properties:
        name:
          type: string
          maxLength: 120
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [listings:read, listings:write, photos:write, analytics:read, webhooks:manage]

    ApiCredentialSecret:
      type: object
      properties:
        id:
          type: string
          format: uuid
        key_id:
          type: string
        secret:
          type: string
          description: Returned only once
        scopes:
          type: array
          items:
            type: string

    WebhookCreate:
      type: object
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - listing.published
              - listing.updated
              - listing.archived
              - listing.blocked
              - listing.trust_status_changed
              - media.processed
              - media.failed

    Webhook:
      allOf:
        - $ref: '#/components/schemas/WebhookCreate'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [active, degraded, disabled]
            created_at:
              type: string
              format: date-time

    Error:
      type: object
      required: [code, message, correlation_id]
      properties:
        code:
          type: string
          examples: [VALIDATION_ERROR]
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        correlation_id:
          type: string
