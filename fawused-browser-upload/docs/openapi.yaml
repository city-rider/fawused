          format: uuid
        model_id:
          type: string
          format: uuid
        modification_id:
          type: [string, 'null']
          format: uuid
        production_year:
          type: integer
          minimum: 1980
          maximum: 2100
        mileage_km:
          type: integer
          minimum: 0
        vehicle_type:
