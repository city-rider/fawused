        engine_volume_cc:
          type: [integer, 'null']
          minimum: 1
        fuel_type:
          type: string
          enum: [diesel, gas, electric, hybrid, other]
          default: diesel
        wheel_formula:
          type: string
          maxLength: 16
        gearbox:
          $ref: '#/components/schemas/Gearbox'
        ecological_class:
          type: [string, 'null']
        gross_weight_kg:
          type: [integer, 'null']
          minimum: 0
        curb_weight_kg:
          type: [integer, 'null']
          minimum: 0
        payload_kg:
          type: [integer, 'null']
          minimum: 0
        wheelbase_mm:
          type: [integer, 'null']
          minimum: 0
        fuel_tank_l:
          type: [integer, 'null']
          minimum: 0
        body_type:
          type: [string, 'null']
        price_rub:
          type: integer
          minimum: 1
        vat_status:
          $ref: '#/components/schemas/VatStatus'
        leasing_available:
