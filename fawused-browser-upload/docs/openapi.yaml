        lon:
          type: number
          minimum: -180
          maximum: 180
        contact_phone:
          type: string
        telegram:
          type: [string, 'null']
        description:
          type: [string, 'null']
          maxLength: 10000
        video_url:
          type: [string, 'null']
          format: uri

    ListingPatch:
      type: object
      additionalProperties: false
