      properties:
        mileage_km:
          type: integer
          minimum: 0
        price_rub:
          type: integer
          minimum: 1
        vat_status:
          $ref: '#/components/schemas/VatStatus'
        leasing_available:
          type: boolean
        city_id:
          type: string
          format: uuid
        lat:
          type: number
        lon:
          type: number
