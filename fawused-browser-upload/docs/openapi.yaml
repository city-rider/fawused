        client_filename:
          type: string
        position:
          type: integer
          minimum: 1
          maximum: 25

    ListingPhoto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [uploaded, validated, processing, ready, failed]
        position:
          type: integer
        public_url:
          type: [string, 'null']
          format: uri

    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingCreate'
        - type: object
          required: [id, lifecycle_status, trust_status]
          properties:
